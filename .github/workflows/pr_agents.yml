name: PR Agents Pipeline

on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches: [main]

permissions:
  contents: read
  pull-requests: write

jobs:
  run-pr-agents:
    runs-on: ubuntu-latest

    env:
      AZURE_OPENAI_ENDPOINT: ${{ secrets.AZURE_OPENAI_ENDPOINT }}
      AZURE_OPENAI_API_KEY: ${{ secrets.AZURE_OPENAI_API_KEY }}
      AZURE_OPENAI_DEPLOYMENT_NAME: ${{ secrets.AZURE_OPENAI_DEPLOYMENT_NAME }}
      AZURE_OPENAI_API_VERSION: ${{ secrets.AZURE_OPENAI_API_VERSION }}
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GITHUB_REPOSITORY: ${{ github.repository }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.13.0
        uses: actions/setup-python@v5
        with:
          python-version: 3.13.0

      - name: Cache pip packages
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run PR Description Agent
        if: github.event.action == 'opened'
        run: |
          python -c "
          from agents.pr_description_agent import PRDescriptionAgent, PRDescriptionConfig
          import os

          agent = PRDescriptionAgent(PRDescriptionConfig(
            azure_openai_endpoint=os.environ.get('AZURE_OPENAI_ENDPOINT', ''),
            azure_openai_key=os.environ.get('AZURE_OPENAI_API_KEY', ''),
            azure_openai_deployment=os.environ.get('AZURE_OPENAI_DEPLOYMENT_NAME', 'gpt-4o'),
            azure_openai_api_version=os.environ.get('AZURE_OPENAI_API_VERSION', '2024-12-01-preview'),
            github_token=os.environ['GITHUB_TOKEN'],
            repo_name='${{ github.repository }}',
            pull_request_number=${{ github.event.pull_request.number }}
          ))
          result = agent.run()
          print(f'PR description {result[\"action\"]} for PR #{result[\"pr_number\"]}')
          "

      - name: Run Review + Build Prediction (LangGraph)
        if: github.event.action != 'opened'
        run: |
          python -c "
          from orchestrator.langgraph_orchestrator import build_orchestrator
          import os

          graph = build_orchestrator()
          result = graph.invoke({
              'task': 'full_pipeline',
              'repo_name': os.environ.get('GITHUB_REPOSITORY', ''),
              'pr_number': ${{ github.event.pull_request.number }},
              'backlog_items': None,
              'messages': [],
              'code_review_result': None,
              'backlog_result': None,
              'build_prediction': None,
              'build_status': None,
              'error': None,
          })
          for msg in result.get('messages', []):
              print(msg)
          "
